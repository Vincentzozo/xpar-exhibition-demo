(function xparLanguageLayer(dictionary){
 'use strict';
 const han=/[\u3400-\u9fff]/;
 const keys=Object.keys(dictionary).sort((a,b)=>b.length-a.length);
 const pattern=new RegExp(keys.map(k=>k.replace(/[.*+?^$()|[\]\\{}]/g,'\\$&')).join('|'),'g');
 const originals=new WeakMap(), rendered=new WeakMap(), attributes=new WeakMap();
 let language='zh', pending=false, roots=new Set();
 try{language=localStorage.getItem('xpar.language')==='en'?'en':'zh'}catch{}
 function english(value){
  if(!han.test(value))return value;
  if(dictionary[value.trim()])return value.replace(value.trim(),dictionary[value.trim()]);
  return value.replace(pattern,m=>' '+dictionary[m]+' ').replace(/，/g,', ').replace(/。/g,'. ').replace(/；/g,'; ').replace(/：/g,': ').replace(/（/g,' (').replace(/）/g,') ').replace(/[“”]/g,'"').replace(/、/g,', ').replace(/[ \t]{2,}/g,' ').replace(/ +([,.;:)])/g,'$1').replace(/([(]) +/g,'$1').trim();

  const nodes=[root,...root.querySelectorAll('*')];
  for(const el of nodes){
   if(!allowed(el))continue;
   if(el.tagName==='OPTION'&&!el.hasAttribute('value'))el.setAttribute('value',el.value);
   let state=attributes.get(el);if(!state){state={};attributes.set(el,state)}
   for(const key of ['title','placeholder','aria-label','alt']){
    if(!el.hasAttribute(key))continue;
    const now=el.getAttribute(key),entry=state[key];
    const original=entry&&now===entry.output?entry.original:now;
    const output=language==='en'?english(original):original;
    state[key]={original,output};

 function setLanguage(next,save=true){

alyzed parameter","统计结果；按设备、参数及日/周/自定义时段显示，附有效数据范围；缺失值不填0。":"Statistics by device, parameter and day/week/custom range, with valid data coverage. Missing values are not filled with zero.","明期/暗期平均值":"Light/dark period means","统计结果；依据PPFD阈值划分明暗，分别显示环境及光指标均值；标明阈值和有效数据范围。无PPFD的型号需另定划分方式。":"Light and dark periods use a PPFD threshold. Climate and light means show the threshold and valid coverage. Models without PPFD require another classification method.","明期时长":"Light-period duration","光周期":"Photoperiod","统计结果；显示每天PPFD高于明暗阈值的有效时长；阈值、日界线及缺失时段应明确。":"Daily valid duration with PPFD above the threshold. Threshold, day boundary and missing intervals are shown.","暗期时长":"Dark-period duration","统计结果；显示每天PPFD低于或等于明暗阈值的有效时长；缺失时段不能自动计为暗期。":"Daily valid duration at or below the PPFD threshold. Missing intervals are not counted as darkness.","目标区间达标率":"Time within target range","统计结果；有效数据处于目标上下限范围内的时间占比；展示目标及有效时长，缺失时段不算达标。":"Percentage of valid time within the target limits. Targets and valid duration are shown; missing intervals do not count as in-range.","超限次数":"Excursion count","统计结果；按设备、参数及高于/低于目标分别计数；连续超限如何合并为一次、阈值附近如何防反复触发需统一。":"Counted by device, parameter and above/below target. Rules for merging continuous excursions and preventing repeated threshold triggers require agreement.","超限累计时长":"Total excursion duration","统计结果；有效超限时段的时长总和；支持与趋势定位及导出，缺口不延伸计时。":"Sum of valid excursion durations, with chart navigation and export. Timing does not extend across gaps.","最长单次超限时长":"Longest excursion duration","统计结果；显示最长连续超限时长及对应起止时间；沿用统一的超限事件划分规则。":"Longest continuous excursion with start and end times, using shared event classification rules.","日平均气温":"Daily mean air temperature","可换算显示°F":"Can be displayed in °F","统计结果；按有效温度记录覆盖时长加权，显示每日明细及有效覆盖率；未完整日另行标识。":"Time-weighted mean of valid temperature records, with daily details and coverage. Partial days are labeled separately.","日平均气温累加":"Sum of daily mean air temperatures","统计结果；按设定起点累计日均温，不默认减基温或截断负温；完整日累计与未完整日暂估分开。":"Daily means accumulated from the selected start, without base subtraction or negative clipping. Complete-day totals and partial-day estimates are separate.","数据质量统计；有效数据覆盖时长占统计时段的比例；积温最低有效覆盖阈值未配置，支持明细及导出。":"Valid data duration divided by the analysis period. Minimum coverage for temperature sums is not configured. Details and export are available.","叶绿素a参考加权响应":"Chlorophyll a weighted response","叶绿素b参考加权响应":"Chlorophyll b weighted response","依权重及公式定义":"Depends on weights and formula","X400；对同一光谱按叶绿素a参考权重加权积分，显示响应值及对比差异；保留权重来源与版本。权重、公式及结果单位未配置；不是叶绿素含量。":"X400: integrates a spectrum with chlorophyll a reference weights, showing response and comparison differences. Weight source and version are retained. Weights, formula and units are not configured. This is not chlorophyll content.","X400；对同一光谱按叶绿素b参考权重加权积分，显示响应值及对比差异；保留权重来源与版本。权重、公式及结果单位未配置；不是叶绿素含量。":"X400: integrates a spectrum with chlorophyll b reference weights, showing response and comparison differences. Weight source and version are retained. Weights, formula and units are not configured. This is not chlorophyll content.","工具栏可开始或暂停记录。打开“历史记录”选择日期和参数；打开“导出与报告”选择设备、时段及参数，可保存CSV、Excel或PNG图表。暂停记录不会删除历史数据。":"Start or pause recording from the toolbar. Select dates and parameters in Historical records. In Export & reports, select devices, periods and parameters to save CSV, Excel or PNG charts. Pausing does not delete history.","空气VPD表示空气的水汽压亏缺。露点温度表示空气中的水汽开始凝结时的温度；空气露点裕量不直接判断叶片是否结露。DLI表示一天累计的光照量，数据缺失时同时关注记录覆盖率。":"Air VPD is the vapor pressure deficit of air. Dew point is the temperature at which water vapor starts condensing. Air dew point margin does not determine leaf condensation. DLI is accumulated daily light; check coverage when data is missing.","选择支持光谱的设备，进入“光谱分析 → 多光谱比较”。最多可选择6条光谱，并指定一条参考光谱。归一化用于比较曲线形状，绝对PFD使用原始光谱计算。":"Select a spectrum-capable device and open Spectrum analysis → Spectrum comparison. Select up to six spectra and designate a reference. Normalization compares shapes; absolute PFD uses original spectra.","首页显示 o export","按指定时段与周期采集，结束后恢复原设置":"Acquire at specified times and intervals, then restore previous settings.","同一设备同一时间只执行一个采集任务。任务结束或取消后恢复原采样配置。":"Only one acquisition task can run per device at a time. Completion or cancellation restores the previous sampling settings.","连接设备后可创建采集任务":"Connect a device to create acquisition tasks.","查看超限、设备异常及恢复记录":"Review threshold alerts, device faults and recovery events.","活动事件":"Active events","尚无设备事件":"No device events","暂无设备事件":"No device events","仅统计已记录事件":"Based on recorded events only","以设备事件为依据":"Based on device events","说明":"Description","保存本机配置与记录，恢复前核对覆盖范围":"Save local settings and records. Review the scope before restoring.","包含内容":"Contents","配置、目标、记录、波段、参考光谱及任务快照":"Settings, targets, records, bands, reference spectra and task snapshots","选择本软件导出的 JSON 备份文件，最大 12 MB。":"Select a JSON backup exported by this application, up to 12 MB.","恢复说明":"Restore notes","恢复前会显示备份时间、设备数量和记录数量，并保存当前快照。恢复不更换当前账号；密码不写入备份。有活动任务时不能覆盖恢复。设备连接状态不随备份恢复为在线。":"Review the backup date and record counts before restoring. A current snapshot is saved first. Your account is retained and passwords are excluded. Active tasks block restoration. Restored devices remain disconnected.","运行目标":"Target platform","本机存储":"Local storage","检查更新":"Check for updates","当前在线页面用于界面评审，设备通信与正式账号认证尚未接入。":"This online page is for UI review. Device communication and production account authentication are not implemented.","版本服务尚未接入":"Update service is not connected","统计有效记录，查看光照积累与环境变化":"Review valid measurements, light accumulation and environmental changes.","超限统计":"Threshold statistics","累计时长":"Total duration","统计口径":"Calculation method","可按 PPFD 阈值或每日明暗时段划分；缺失数据不自动计入暗期。":"Divide light and dark periods by a PPFD threshold or daily schedule. Missing data is not classified as dark.","设备接入后确认可用数据与统计设置。":"Connect a device to confirm available data and calculation settings.","PPFD 阈值":"PPFD threshold","平均气温":"Mean air temperature","待配置":"Not configured","有效 PPFD 时间积分":"Time 使用说明":"User guide","选择接口和串口，连接后核对设备信息。":"Choose an interface and port, connect, then verify device information.","打开":"Open","查看数值与光谱，开始保存测量记录。":"View readings and spectra, then start recording.","分析与导出":"Analyze and export","查询时段、检查数据质量，再导出所需参数。":"Choose a range, review data quality, then export the required parameters.","设备未连接或读数显示“—”怎么办？":"Why is the device disconnected or showing “—”?","检查供电、USB 与 RS485 接线，并确认串口和通信参数。没有有效读数时显示“—”，缺失记录不填0。":"Check power, USB and RS485 wiring, then confirm the port and communication settings. Invalid readings display “—”; missing records are not filled with zero.","空气 VPD、露点与 DLI 如何理解？":"What do air VPD, dew point and DLI mean?","空气 VPD 与露点使用同期空气温度和相对湿度计算；空气露点裕量不能直接判定叶片结露。DLI 是一天内有效 PPFD 的时间积分，同时需要关注有效覆盖率。":"Air VPD and dew point use simultaneous air temperature and relative humidity. Air dew point margin alone cannot determine leaf condensation. DLI integrates valid PPFD over a day; valid data coverage also matters.","怎样导出数据？":"How do I export data?","在“导出与报告”选择设备、时段和参数。预览与 CSV、Excel、图表使用相同筛选结果，时间戳、单位和质量标记一并保留。":"Select devices, time ranges and parameters in Export & reports. Preview, CSV, Excel and charts use the same filters, including timestamps, units and quality flags.","如何进入设备维护？":"How do I open device maintenance?","使用右上角“工程师登录”进入维护模式。退出后返回用户模式，维护页面关闭，本地记录保留。":"Use Engineer sign-in in the top-right corner. Signing out returns to user mode, closes maintenance pages and retains local records.","怎样保存本机配置？":"How do I save local settings?","在“数据备份”导出 JSON 文件。恢复时先预览内容与覆盖范围，有活动任务时请先结束任务。":"Export a JSON file from Data backup. Review the contents and scope before restoring, and end active tasks first.","设备通信参数由设备回读。修改地址或波特率后需要重新连接并验证。":"Communication settings are read from the device. Address or baud rate changes require reconnection and verification.","整数 1–247，同一总线地址不能重复。":"Integer 1–247. Each address must be unique on the bus.","以设备支持的波特率为准。":"Depends on the baud rates supported by the device.","预留":"Reserved","网关地址":"Gateway address","预留标准网关接入位置，当前未建立 TCP 连接。":"Reserved for a standard gateway. No TCP connection is active.","用户偏移与工厂校准分别管理；恢复用户偏移不会擦除工厂校准数据。":"User offsets and factory calibration are managed separately. Resetting user offsets preserves factory calibration.","允许范围":"Allowed range","最近用户校准：—":"Last user calibration: —","通信报文":"Communication log","暂停显示":"Pause display","保存日志":"Save log","建立设备连接后显示实际收发与错误记录。":"Actual traffic and error logs appear after connecting a device.","清空显示不删除历史测量数据。":"Clearing the display preserves historical measurements.","设备与固件":"Device and firmware","固件文件":"Firmware file","连接设备并核对型号、版本与兼容性后才可升级。":"Connect a device and verify its model, version and compatibility before updating.","升级期间保持设备供电与连接；发生失败时保留状态和恢复指引。":"Maintain power and connection during updates. Failures retain status and recovery guidance.","暂无操作记录":"No activity logs","暂无测量数据":"No measurement data","修改设置后可保存":"Edit settings to enable saving","请先选择备份文件":"Choose a backup file first","连接设备并获取有效数据后可用":"Available after connecting a device and acquiring valid data","趋势参数":"Trend parameter","时间与时区":"Time and time zone","温度单位":"Temperature unit","大气压单位":"Air pressure unit","本地保存":"Local storage"});
