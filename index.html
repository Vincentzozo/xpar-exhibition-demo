const META={ppfd:{name:'PPFD',unit:'μmol·m⁻²·s⁻¹',color:'#009b7b',digits:0,detail:'光合光子通量密度'},temp:{name:'空气温度',unit:'°C',color:'#d39a5e',digits:1,detail:'空气直接测量值'},rh:{name:'相对湿度',unit:'%RH',color:'#8273dc',digits:1,detail:'空气相对湿度'},co2:{name:'CO₂',unit:'ppm',color:'#6595c2',digits:0,detail:'空气二氧化碳浓度'},vpd:{name:'空气 VPD',unit:'kPa',color:'#b77e9d',digits:2,detail:'由同期温度与 RH 计算'},dew:{name:'露点温度',unit:'°C',color:'#6ba5a1',digits:1,detail:'由同期温度与 RH 计算'},eppfd:{name:'ePPFD',unit:'μmol·m⁻²·s⁻¹',color:'#598fe0',digits:0,detail:'400–750 nm 演示定义'},dli:{name:'累计 DLI',unit:'mol·m⁻²',color:'#009b7b',digits:2,detail:'当日有效 PPFD 积分'}};

const S={view:'live',role:'User Access',connected:true,recording:false,records:[],ref:Array.isArray(saved.ref)?saved.ref:null,refTime:saved.refTime||'',intensity:100,light:'white',primary:'ppfd',secondary:'temp',range:15,paused:false,normalized:false,tour:false,historyMode:'trend',hour:24,historyPrimary:'ppfd',historySecondary:'temp',goal:Number.isFinite(saved.goal)?saved.goal:32,exportSource:'day',exportKeys:['ppfd','temp','rh','co2','vpd','dew'],comm:{com:'COM3',address:1,baud:19200},tick:0,lastSpectrum:Date.now(),exportStart:'',exportEnd:'',lastSample:Date.now()};

const f=(n,d=1)=>n==null||!Number.isFinite(n)?'—':n.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});
function climate(t,rh){let es=.6108*Math.exp(17.27*t/(t+237.3)),g=Math.log(rh/100)+17.625*t/(243.04+t);return {vpd:es*(1-rh/100),dew:243.04*g/(17.625-g)}}
function spectrum(light=S.light,intensity=S.intensity){return Array.from({length:101},(_,i)=>{let w=350+i*5,g=(a,m,d)=>a*Math.exp(-.5*((w-m)/d)**2),v=light==='blue'?g(2.4,450,20)+g(.5,660,28)+g(.2,550,60):light==='red'?g(.35,450,24)+g(2.8,660,25)+g(.22,730,23)+g(.15,550,65):g(1.65,450,21)+g(1.3,550,58)+g(1.7,650,38)+g(.25,735,23);return [w,v*intensity/100]})}
function integrate(c,lo,hi){let n=0;for(let i=1;i<c.length;i++){let [x,y]=c[i-1],[xx,yy]=c[i];let a=Math.max(lo,x),b=Math.min(hi,xx);if(b>a){let ya=y+(yy-y)*(a-x)/(xx-x),yb=y+(yy-y)*(b-x)/(xx-x);n+=(ya+yb)*.5*(b-a)}}return n}
let curve=spectrum();
function sample(t=Date.now(),phase=S.tick){let temp=25.4+Math.sin(phase/32)*.24,rh=66.8+Math.sin(phase/25+.8)*1.3;return {t,temp,rh,co2:984+Math.sin(phase/19)*18,ppfd:integrate(curve,400,700),eppfd:integrate(curve,400,750),...climate(temp,rh)}}
let current=sample();let live=Array.from({length:181},(_,i)=>{let t=Date.now()-(180-i)*5000,r=sample(t,i/2);r.ppfd*=.94+.06*Math.sin(i/38)+.02*Math.sin(i/13);r.eppfd=r.ppfd*integrate(curve,400,750)/integrate(curve,400,700);return r});
const dayStart=new Date();dayStart.setHours(0,0,0,0);dayStart.setDate(dayStart.getDate()-1);
const day=Array.from({length:288},(_,i)=>{let hour=i/12,on=hour>=6&&hour<22,ppfd=on?(520+65*Math.sin((hour-6)/16*Math.PI)+13*Math.sin(hour*2)):0,temp=on?25.5+1.4*Math.sin((hour-6)/16*Math.PI):22.2+.3*Math.sin(hour),rh=on?66-4*Math.sin((hour-6)/16*Math.PI):76+1.2*Math.sin(hour);return {t:dayStart.getTime()+i*300000,temp,rh,co2:on?1030+60*Math.sin(hour*1.2):770+15*Math.sin(hour),ppfd,eppfd:ppfd*1.11,...climate(temp,rh)}});let runningDli=0;day.forEach(r=>{runningDli+=r.ppfd*300/1e6;r.dli=runningDli});
function localDate(t){let d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function time(t,seconds=false){return new Date(t).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',...(seconds?{second:'2-digit'}:{})})}
function datetime(t){return localDate(t)+' '+time(t,true)}

function header(title,eyebrow,sub,actions=''){return '<div class="page-title between"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="subtitle">'+sub+'</p></div><div class="row">'+actions+'</div></div>'}
function recordingButton(){return '<button class="btnicon '+(S.recording?'soft':'primary')+'" onclick="toggleRecording()">'+icon(S.recording?'pause':'record')+(S.recording?'停止记录':'开始记录')+'</button>'}
function view(v){S.view=VIEWS.some(x=>x[0]===v)?v:'live';location.hash=S.view;S.exportStart='';S.exportEnd='';render();window.scrollTo(0,0)}

function updateConnection(){$('#connectionButton').innerHTML='<span class="dot" style="color:'+(S.connected?'#009b7b':'#d29661')+'"></span> X400 · '+(S.connected?'模拟在线':'模拟离线')}
function metric(k){let m=META[k];return '<button class="metric '+(S.primary===k?'selected ':'')+(!S.connected?'offline':'')+'" onclick="setPrimary(\''+k+'\')" title="查看'+m.name+'曲线"><div class="metric-top"><span class="swatch" style="background:'+m.color+'"></span>'+m.name+'</div><div class="metric-num number" data-value="'+k+'">'+f(current[k],m.digits)+'</div><div class="metric-unit">'+m.unit+'</div><div class="metric-bottom">'+(S.connected?m.detail:'离线 · 保留最后读数')+'</div></button>'}
function parameterOptions(key,allowNone=false){return (allowNone?'<option value="none" '+(key==='none'?'selected':'')+'>不叠加</option>':'')+['ppfd','temp','rh','co2','vpd','dew'].map(k=>'<option value="'+k+'" '+(key===k?'selected':'')+'>'+META[k].name+'</option>').join('')}
function chartControls(primary,secondary,where){return '<span class="legend-item" style="--series:'+META[primary].color+'"><select aria-label="'+(where==='live'?'实时':'历史')+'主曲线" onchange="changeSeries(\''+where+'\',\'primary\',this.value)">'+parameterOptions(primary)+'</select></span><span class="legend-item" style="--series:'+(META[secondary]?.color||'#b1bac1')+'"><select aria-label="'+(where==='live'?'实时':'历史')+'对照曲线" onchange="changeSeries(\''+where+'\',\'secondary\',this.value)">'+parameterOptions(secondary,true)+'</select></span><span class="axisnote">不同单位使用左右独立刻度 · 悬停查看同一时刻</span>'}
function plotBox(id,cls=''){return '<div class="plotbox '+cls+'" id="'+id+'"><div class="chartstage"></div><div class="tooltip" hidden></div></div>'}

function renderLive(){return header('让每一次变化，都看得见。','LIVE OVERVIEW','X400 / 种植架 A · 冠层监测点',recordingButton()+'<button class="ghost roundbutton" onclick="view(\'spectrum\')">光谱分析 ↗</button>')+(!S.connected?'<div class="banner">设备处于模拟离线状态，以下为最后一次读数，更新时间 '+time(S.lastSample,true)+'。曲线与记录不再追加。</div>':'')+'<div class="metrics">'+['ppfd','temp','rh','co2','vpd','dew'].map(metric).join('')+'</div><section class="panel"><div class="panel-head"><div><h2>实时测量曲线</h2><p>观察光照与环境，在同一时刻的变化</p></div><div class="row"><div class="segmented">'+[5,15,30].map(n=>'<button class="'+(S.range===n?'on':'')+'" onclick="setRange('+n+')">'+n+' min</button>').join('')+'</div><button class="ghost roundbutton" onclick="S.paused=!S.paused;render()">'+(S.paused?'继续绘图':'暂停绘图')+'</button></div></div><div class="chart-options">'+chartControls(S.primary,S.secondary,'live')+'</div>'+plotBox('livePlot')+'<div class="chart-foot"><span id="liveStatus">'+liveStatus()+'</span><span class="pill green" id="recordStatus">'+(S.recording?'● 正在记录 · '+S.records.length+' 条':'○ 尚未开始本次记录')+'</span><span>独立刻度用于对照变化，不代表因果关系</span></div></section><div class="under-chart">'+lightControl()+'<div class="mini-info"><span class="mini-icon">↗</span><div><b>空气 VPD 与露点，随温湿度同步计算</b><p>空气露点裕量 <span id="dewMargin">'+f(current.temp-current.dew,1)+'</span> °C · 空气接近饱和，不等同于叶片结露。</p></div></div></div>'+bottom('实时模拟数据 · 未连接真实设备 · 所有图表与导出保留数据来源')}
function liveStatus(){return (S.connected?'<span class="status-on">● 模拟采集</span>':'<span class="status-off">● 模拟离线</span>')+'　2 s 刷新　最后更新 <span id="lastUpdate">'+time(S.lastSample,true)+'</span>'+(S.paused?'　· 已暂停绘图，采集仍继续':'')}

function setLight(p){if(!S.connected)return toast('模拟设备离线，请先连接');S.light=p;curve=spectrum();S.lastSpectrum=Date.now();current=sample();S.lastSample=current.t;if(S.connected){live.push({...current});if(S.recording)S.records.push({...current})}render()}
function toggleRecording(){S.recording=!S.recording;if(S.recording&&S.connected)S.records.push({...current});toast(S.recording?'开始记录本次模拟数据，2 秒采集一次':'本次记录已停止，已采集数据仍保留');render()}

function renderSpectrum(){return header('看见光的组成。','SPECTRUM STUDIO','完整光谱 · 分波段测量 · 与参考光谱比较','<button class="btnicon roundbutton" onclick="captureSpectrum()" '+(!S.connected?'disabled':'')+'>'+icon('refresh')+'立即采集</button><button class="primary btnicon" onclick="saveReference()" '+(!S.connected?'disabled':'')+'>'+icon('save')+'保存为参考</button>')+(!S.connected?'<div class="banner">模拟设备已离线，当前光谱为最后一次采集结果。</div>':'')+'<section class="panel"><div class="panel-head"><div><h2>光谱分布</h2><p>350–850 nm · 当前为合成演示光谱，波长与单位以正式设备确认值为准</p></div><div class="segmented"><button class="'+(!S.normalized?'on':'')+'" onclick="S.normalized=false;render()">绝对值</button><button class="'+(S.normalized?'on':'')+'" onclick="S.normalized=true;render()">归一化</button></div></div><div class="spectrum-tools"><span class="legend-item" style="--series:#009b7b">当前光谱</span>'+(S.ref?'<label class="legend-item" style="--series:#8273dc">参考 · '+esc(S.refTime)+'</label><button class="ghost roundbutton muted" onclick="clearReference()">移除参考</button>':'<span class="emptyref">保存一条参考，再调整光照进行比较</span>')+'<span class="spacer"></span><span class="stat-pill">PPFD <b id="spectrumPPFD">'+f(current.ppfd,0)+'</b></span><span class="stat-pill">ePPFD <b id="spectrumEPPFD">'+f(current.eppfd,0)+'</b></span></div>'+plotBox('spectrumPlot','spectrum')+'<div class="chart-foot"><span>演示光谱密度：μmol·m⁻²·s⁻¹·nm⁻¹</span><span id="spectrumTime">采集于 '+time(S.lastSpectrum,true)+'</span><span>'+(S.normalized?'归一化仅改变图形显示，PFD 比较仍用绝对值':'PPFD：400–700 nm · ePPFD：400–750 nm（演示定义）')+'</span></div><div class="band-stats" id="bandStats">'+bandStats()+'</div></section><div class="under-chart">'+lightControl()+'<div class="light-control" style="background:#fff;border-color:var(--line)"><div class="control-text"><h3>演示光谱场景</h3><p>用于比较操作演示</p></div><div class="segmented">'+[['white','白光'],['blue','蓝光增强'],['red','红光增强']].map(([k,n])=>'<button class="'+(S.light===k?'on':'')+'" onclick="setLight(\''+k+'\')">'+n+'</button>').join('')+'</div></div></div><div class="comparison-bar" id="comparisonBar">'+comparisonBar()+'</div>'+bottom('光谱与波段均为演示定义 · 此处不代表设备量程或产品精度承诺')}

function drawLive(){let rows=live.filter(r=>r.t>=S.lastSample-S.range*60000);placeChart('livePlot',chartSVG(rows,[S.primary,...(S.secondary!=='none'?[S.secondary]:[])],{id:'livePlot'}))}
function drawHistory(){let d=daySummary();placeChart('historyPlot',chartSVG(d.rs,S.historyMode==='dli'?['dli']:[S.historyPrimary,...(S.historySecondary!=='none'?[S.historySecondary]:[])],{id:'historyPlot',day:true}))}
function drawSpectrum(){let e=$('#spectrumPlot .chartstage');if(!e)return;let W=1100,H=440,L=62,R=35,T=35,B=48,pw=W-L-R,ph=H-T-B,values=[curve,...(S.ref?[S.ref]:[])],maxs=values.map(c=>Math.max(...c.map(p=>p[1]))),max=S.normalized?1.08:Math.max(...maxs)*1.13||1,x=w=>L+(w-350)/500*pw,y=v=>T+ph-v/max*ph;let html='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="350至850纳米演示光谱曲线"><defs><linearGradient id="spectralFill" x1="0" x2="1"><stop offset="0%" stop-color="#a180d8"/><stop offset="23%" stop-color="#5c8fdf"/><stop offset="43%" stop-color="#69c29b"/><stop offset="60%" stop-color="#d3c272"/><stop offset="78%" stop-color="#d48679"/><stop offset="100%" stop-color="#bd8bb3"/></linearGradient><linearGradient id="spectralArea" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#50b796" stop-opacity=".15"/><stop offset="100%" stop-color="#50b796" stop-opacity=".01"/></linearGradient></defs><rect width="1100" height="440" fill="white"/>';for(let j=0;j<=4;j++){let yy=T+ph*j/4;html+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#edf1f2" stroke-dasharray="3 5"/><text x="'+(L-13)+'" y="'+(yy+4)+'" text-anchor="end">'+f(max*(1-j/4),1)+'</text>'}html+='<text x="62" y="17">'+(S.normalized?'归一化强度（各自峰值 = 1）':'μmol·m⁻²·s⁻¹·nm⁻¹ · 演示单位')+'</text>';values.forEach((c,i)=>{let points=c.map(p=>[x(p[0]),y(S.normalized?(maxs[i]>0?p[1]/maxs[i]:0):p[1])]),d=points.map((p,j)=>(j?'L':'M')+p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');if(!i)html+='<path d="'+d+' L'+x(850)+','+(T+ph)+' L'+x(350)+','+(T+ph)+' Z" fill="url(#spectralArea)"/>';html+='<path d="'+d+'" fill="none" stroke="'+(i?'#8273dc':'#009b7b')+'" stroke-width="'+(i?'2.2':'3')+'" '+(i?'stroke-dasharray="7 5"':'')+' stroke-linecap="round"/>'});for(let w=350;w<=850;w+=50)html+='<text x="'+x(w)+'" y="'+(H-16)+'" text-anchor="middle">'+w+'</text>';html+='<rect x="'+L+'" y="'+(H-B+9)+'" width="'+pw+'" height="4" rx="2" fill="url(#spectralFill)" opacity=".8"/><text x="'+(W-R)+'" y="'+(H-1)+'" text-anchor="end">波长 / nm</text><line class="hoverline" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" opacity="0"/></svg>';e.innerHTML=html;chartData.set('spectrumPlot',{spectral:true,curves:values,normalized:S.normalized,maxs,L,R,W,H})}
function drawCharts(){if(S.view==='live')drawLive();if(S.view==='spectrum')drawSpectrum();if(S.view==='history')drawHistory()}
document.addEventListener('pointermove',ev=>{let box=ev.target.closest('.plotbox');if(!box)return;let d=chartData.get(box.id),svg=box.querySelector('svg'),tip=box.querySelector('.tooltip');if(!d||!svg||!tip)return;let r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*d.W;if(px<d.L||px>d.W-d.R){tip.hidden=true;return}let text='',xx;if(d.spectral){let w=350+(px-d.L)/(d.W-d.L-d.R)*500,i=Math.max(0,Math.min(100,Math.round((w-350)/5)));xx=d.L+i/100*(d.W-d.L-d.R);text='<b>'+d.curves[0][i][0]+' nm</b><br>'+d.curves.map((c,j)=>'<span style="color:'+(j?'#c4b5ff':'#a4e7c9')+'">'+(j?'参考':'当前')+'　'+f(d.normalized?(d.maxs[j]>0?c[i][1]/d.maxs[j]:0):c[i][1],3)+'</span>').join('<br>')}else{let target=d.xmin+(px-d.L)/(d.W-d.L-d.R)*(d.xmax-d.xmin),i=d.rs.reduce((best,q,index)=>Math.abs(q.t-target)<Math.abs(d.rs[best].t-target)?index:best,0),q=d.rs[i];xx=d.L+(q.t-d.xmin)/(d.xmax-d.xmin)*(d.W-d.L-d.R);text='<b>'+time(q.t,true)+'</b><br>'+d.keys.map(k=>'<span style="color:'+(k==='ppfd'?'#a4e7c9':'#ded1ff')+'">'+META[k].name+'　'+f(q[k],META[k].digits)+' '+META[k].unit+'</span>').join('<br>')}let line=svg.querySelector('.hoverline');line.setAttribute('x1',xx);line.setAttribute('x2',xx);line.setAttribute('opacity','1');tip.innerHTML=text;tip.hidden=false;tip.style.left=Math.max(95,Math.min(r.width-100,xx/d.W*r.width))+'px';tip.style.top=Math.max(130,Math.min(r.height-20,ev.clientY-r.top))+'px'});
document.addEventListener('pointerout',ev=>{let b=ev.target.closest('.plotbox');if(b&&!b.contains(ev.relatedTarget)){b.querySelector('.tooltip').hidden=true;b.querySelector('.hoverline')?.setAttribute('opacity','0')}});
function modal(title,body,footer){$('#modal').innerHTML='<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-head between"><h2>'+title+'</h2><button class="ghost" onclick="closeModal()" aria-label="关闭对话框">×</button></div><div class="modal-body">'+body+'<div id="formError" class="error" role="alert"></div></div><div class="modal-foot">'+footer+'</div></section></div>';setTimeout(()=>$('#modal input, #modal select, #modal button')?.focus(),0)}
function closeModal(){$('#modal').innerHTML=''}
function roleDialog(){modal('切换演示角色','<label class="field">访问角色<select id="roleSelect"><option value="User Access" '+(S.role==='User Access'?'selected':'')+'>用户 · User Access</option><option value="Engineer Access" '+(S.role==='Engineer Access'?'selected':'')+'>工程师 · Engineer Access</option></select></label><label class="field">密码<input id="rolePassword" type="password" autocomplete="off" placeholder="任意填写，也可留空"></label><p class="note">用户查看测量、分析和导出。工程师额外拥有模拟通信参数配置入口；所有操作仅影响此演示。</p>','<button onclick="closeModal()">取消</button><button class="primary" onclick="changeRole()">切换角色</button>')}
function changeRole(){S.role=$('#roleSelect').value==='Engineer Access'?'Engineer Access':'User Access';closeModal();render();toast(S.role==='Engineer Access'?'已进入工程师模式：连接设置中可配置模拟通信参数':'已进入用户模式')}
function connectionDialog(){let eng=S.role==='Engineer Access';modal('设备连接 · 模拟','<div class="connection-info"><b>X400 · 种植架 A</b><br>DEMO-X400-001 · '+(S.connected?'模拟在线':'模拟离线')+'<br><span class="tiny">原型不打开串口，也不会连接真实设备。</span></div><label class="field" style="margin-top:20px">模拟 COM 口<select id="connCom">'+['COM3','COM5','COM8'].map(c=>'<option '+(c===S.comm.com?'selected':'')+'>'+c+'</option>').join('')+'</select></label>'+(eng?'<div class="settings-grid"><label class="field">Modbus 地址<input id="connAddress" type="number" min="1" max="247" value="'+S.comm.address+'"></label><label class="field">波特率<select id="connBaud">'+[9600,19200,38400].map(n=>'<option '+(n===S.comm.baud?'selected':'')+'>'+n+'</option>').join('')+'</select></label></div><p class="note">工程师专属 · 保存后模拟回读。数据位 8 / 无校验 / 1 停止位。</p>':'<p class="note">通信地址与波特率配置在工程师模式提供。</p>'),(S.connected?'<button class="danger" onclick="disconnect()">模拟断开</button>':'')+'<button class="primary" onclick="connect()">'+(S.connected?'保存模拟连接':'模拟连接')+'</button>')}
function connect(){let comm={...S.comm,com:$('#connCom').value};if(S.role==='Engineer Access'){let n=+$('#connAddress').value;if(!Number.isInteger(n)||n<1||n>247)return $('#formError').textContent='Modbus 地址必须为 1–247 的整数';comm.address=n;comm.baud=+$('#connBaud').value}S.comm=comm;S.connected=true;S.lastSample=Date.now();curve=spectrum();current=sample();live.push({...current});closeModal();render();toast('模拟设备已连接，通信参数模拟回读完成')}
function disconnect(){S.connected=false;closeModal();render();toast('已模拟断开，保留最后读数，停止追加数据')}
async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('浏览器暂不支持此操作，可按 F11 全屏')}}
const TOUR=[['先看，一台设备能测什么','点击不同指标切换大曲线；开始记录，再用下方滑杆演示光照变化。'],['再看，光的组成如何变化','先保存参考光谱，再切换白光／蓝光／红光场景，比较同波段 PFD。'],['把瞬时读数，放回一天里','回放合成预录示例，拖动回放时间，查看环境趋势、累计 DLI 与光周期。'],['把这次观察，真正保存下来','选择本次模拟记录或预录示例，勾选参数，导出 CSV、Excel 或曲线 PNG。']];
function startTour(){S.tour=true;view('live')}
function tourMove(delta){let i=VIEWS.findIndex(x=>x[0]===S.view)+delta;if(i>=4){S.tour=false;render();toast('演示完成。可以继续自由查看四个工作页面。')}else view(VIEWS[Math.max(0,i)][0])}
function renderTour(){if(!S.tour){$('#tour').innerHTML='';return}let i=VIEWS.findIndex(x=>x[0]===S.view);$('#tour').innerHTML='<div class="tourbar"><span class="tourcount">0'+(i+1)+'</span><div><b>'+TOUR[i][0]+'</b><p>'+TOUR[i][1]+'</p></div><span class="spacer"></span>'+(i?'<button class="tour-prev" onclick="tourMove(-1)">上一步</button>':'')+'<button class="tour-next" onclick="tourMove(1)">'+(i===3?'完成演示':'下一步 →')+'</button><button class="close-tour" aria-label="退出演示向导" onclick="S.tour=false;render()">×</button></div>'}
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v)&&v!==S.view){S.view=v;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.target.matches('input,select,textarea'))return;if(S.tour&&e.key==='ArrowRight'){e.preventDefault();tourMove(1)}if(S.tour&&e.key==='ArrowLeft'){e.preventDefault();tourMove(-1)}});
let route=location.hash.slice(1);if(VIEWS.some(x=>x[0]===route))S.view=route;render();
setInterval(()=>{if(!S.connected)return;S.tick++;curve=spectrum();current=sample();S.lastSample=current.t;S.lastSpectrum=current.t;live.push({...current});live=live.slice(-1200);if(S.recording){S.records.push({...current});if(S.records.length>36000){S.recording=false;toast('已达到演示记录上限，请先导出')}}updateLive();if(S.view==='spectrum'){updateSpectrumStats();drawSpectrum()}if(S.view==='export'){if($('#recordCount'))$('#recordCount').textContent=S.records.length;if(S.recording&&S.records.length%5===0&&!document.activeElement?.matches('input,select,textarea')&&!$('#modal').innerHTML)render()}},2000);
</script></body></html>
